spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=false

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=testsecret123

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/test-issuer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/test-issuer/certs
spring.security.oauth2.resourceserver.jwt.audiences=test-audience
client-id=test-client
client-secret=test-secret